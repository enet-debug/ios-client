name: Build ClientControl dylib
on:
  workflow_dispatch:
  push:
    paths:
      - 'ios-module/**'
      - '.github/workflows/build-dylib.yml'

jobs:
  build:
    runs-on: macos-15-intel
    steps:
      - uses: actions/checkout@v4
      - name: Build arm64 dylib
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ARTIFACT_ID="$(gh api 'repos/${{ github.repository }}/actions/artifacts?name=ClientControl-dylib&per_page=1' --jq '.artifacts[0].id // empty')"
          if [ -n "$ARTIFACT_ID" ]; then
            gh api "repos/${{ github.repository }}/actions/artifacts/$ARTIFACT_ID/zip" > previous.zip
            REGISTRATION_KEY="$(unzip -p previous.zip server-registration-key.txt)"
          else
            REGISTRATION_KEY="$(openssl rand -hex 32)"
          fi
          printf '%s' "$REGISTRATION_KEY" > server-registration-key.txt
          SDK="$(xcrun --sdk iphoneos --show-sdk-path)"
          xcrun --sdk iphoneos clang -fobjc-arc -dynamiclib -arch arm64 \
            -miphoneos-version-min=15.0 -isysroot "$SDK" \
            -framework UIKit -framework Security -lsqlite3 \
            -DLG_REGISTRATION_KEY='"'"$REGISTRATION_KEY"'"' \
            -install_name '@rpath/ClientControl.dylib' \
            ios-module/ClientControl.m -o ClientControl.dylib
          file ClientControl.dylib
      - uses: actions/upload-artifact@v4
        with:
          name: ClientControl-dylib
          path: |
            ClientControl.dylib
            server-registration-key.txt

